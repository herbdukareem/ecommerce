name: Deploy to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-main
  cancel-in-progress: false

env:
  # cPanel account paths (confirmed)
  SHARED_DOCUMENT_ROOT: /home/rhocomng/public_html
  DEPLOY_PATH: /home/rhocomng/public_html/ecommerce.custechth.org
  DOCUMENT_ROOT: /home/rhocomng/public_html/ecommerce.custechth.org/public

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
      CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Keep deploy workflow robust even if lockfile is missing on a branch.
          # (CI workflow should remain strict.)

      - name: Install and build frontend assets
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Prepare SSH key and known_hosts
        run: |
          set -euo pipefail

          if [ -z "${CPANEL_HOST:-}" ] || [ -z "${CPANEL_USERNAME:-}" ]; then
            echo "Missing CPANEL_HOST or CPANEL_USERNAME secret"
            exit 1
          fi

          if [ -z "${CPANEL_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing CPANEL_SSH_PRIVATE_KEY secret"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Handle both multiline keys and one-line keys containing literal \n escapes.
          printf "%b" "$CPANEL_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate key early for clear diagnostics.
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

          ssh-keyscan -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Upload app files to cPanel via rsync over SSH
        run: |
          set -euo pipefail
          rsync -rlgoDzvc -i --omit-dir-times --no-perms \
            --exclude-from=.github/deploy/rsync-excludes.txt \
            -e "ssh -p $CPANEL_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$CPANEL_USERNAME@$CPANEL_HOST:${{ env.DEPLOY_PATH }}"

      - name: Run post-deploy Laravel commands on server
        run: |
          set -euo pipefail
          ssh -p "$CPANEL_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$CPANEL_USERNAME@$CPANEL_HOST" <<'EOF'
            set -e

            SHARED_ROOT="${{ env.SHARED_DOCUMENT_ROOT }}"
            APP_PATH="${{ env.DEPLOY_PATH }}"
            DOC_ROOT="${{ env.DOCUMENT_ROOT }}"

            case "$APP_PATH" in
              "$SHARED_ROOT"/*) ;;
              *) echo "Refusing deploy: APP_PATH is outside shared document root."; exit 1;;
            esac

            case "$DOC_ROOT" in
              "$SHARED_ROOT"/*) ;;
              *) echo "Refusing deploy: DOCUMENT_ROOT is outside shared document root."; exit 1;;
            esac

            [ -d "$APP_PATH" ] || { echo "Deploy path missing: $APP_PATH"; exit 1; }
            [ -d "$DOC_ROOT" ] || { echo "Document root missing: $DOC_ROOT"; exit 1; }

            cd "$APP_PATH"

            if [ ! -f artisan ]; then
              echo "artisan not found in deploy path"
              exit 1
            fi

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            php artisan storage:link || true

            echo "Deployment complete for $APP_PATH"
          EOF
