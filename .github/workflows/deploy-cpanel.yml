name: Deploy Laravel + Vue to cPanel (FTP)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- PHP / Composer ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, bcmath, curl, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, json

      - name: Install Composer dependencies (no-dev)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # ---------- Node / Vite ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install NPM deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite assets
        run: npm run build
      - name: Ensure Laravel manifest path
        run: |
          if [ -f public/build/.vite/manifest.json ] && [ ! -f public/build/manifest.json ]; then
            cp public/build/.vite/manifest.json public/build/manifest.json
          fi


      # ---------- Laravel optimize ----------
      - name: Laravel optimize (safe)
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # ---------- Prepare deploy folder ----------
      - name: Prepare deploy directory
        run: |
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "vendor" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude ".env" \
            --exclude "storage/*.key" \
            --exclude "storage/logs" \
            --exclude "storage/framework/cache" \
            --exclude "storage/framework/sessions" \
            --exclude "storage/framework/views" \
            --exclude "bootstrap/cache/*.php" \
            ./ ./deploy/

      # IMPORTANT:
      # If your hosting expects only public files in public_html,
      # then deploy ONLY /public to public_html, and keep the rest outside public_html.
      # See notes below.

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          local-dir: deploy/
          server-dir: public_html/ecommerce.custechth.org/
          dangerous-clean-slate: false
