name: Deploy shop.webmedic.ng to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy via SSH/rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, tokenizer, xml, curl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude=".env" \
            --exclude="deploy" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/views/*" \
            ./ deploy/

      - name: Debug deployment package
        run: |
          pwd
          ls -la
          echo "Deploy folder content:"
          ls -la deploy
          echo "Checking for nested deploy folder:"
          find deploy -maxdepth 2 -type d | head -50

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection to Hostinger
        run: |
          ssh -i ~/.ssh/hostinger_key \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            ${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "echo 'SSH connection successful' && pwd && whoami && ls -la"

      - name: Put Laravel app in maintenance mode
        run: |
          ssh -i ~/.ssh/hostinger_key \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            ${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "cd ${{ secrets.HOSTINGER_DEPLOY_PATH }} && ${{ secrets.HOSTINGER_PHP_BIN }} artisan down || true"

      - name: Upload files to Hostinger using rsync
        run: |
          rsync -avz --delete \
            --exclude=".env" \
            --exclude="storage/logs/" \
            --exclude="storage/app/public/" \
            --exclude="storage/framework/cache/" \
            --exclude="storage/framework/sessions/" \
            --exclude="storage/framework/views/" \
            -e "ssh -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_SSH_PORT }} -o StrictHostKeyChecking=yes -o ConnectTimeout=60" \
            deploy/ \
            ${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_DEPLOY_PATH }}/

      - name: Run Laravel deployment commands on Hostinger
        run: |
          ssh -i ~/.ssh/hostinger_key \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=60 \
            ${{ secrets.HOSTINGER_SSH_USERNAME }}@${{ secrets.HOSTINGER_SSH_HOST }} << EOF
              set -e

              cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}

              echo "Using PHP:"
              ${{ secrets.HOSTINGER_PHP_BIN }} -v

              ${{ secrets.HOSTINGER_PHP_BIN }} artisan config:clear
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan cache:clear
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan route:clear
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan view:clear

              ${{ secrets.HOSTINGER_PHP_BIN }} artisan about --only=environment

              ${{ secrets.HOSTINGER_PHP_BIN }} artisan migrate --force
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan storage:link || true

              ${{ secrets.HOSTINGER_PHP_BIN }} artisan config:cache
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan route:cache
              ${{ secrets.HOSTINGER_PHP_BIN }} artisan view:cache

              ${{ secrets.HOSTINGER_PHP_BIN }} artisan up
          EOF
